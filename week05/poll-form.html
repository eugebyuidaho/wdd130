<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Week 05 Poll Form</title>
</head>

<body>
    <header>
        <h1>Website Poll</h1>
    </header>

    <main>
        <form action="#" method="post">
            <!-- Fieldset 1: Contact Information -->
            <fieldset>
                <legend>Contact Information</legend>

                <!-- Full Name -->
                <div>
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" placeholder="e.g., Jane Doe" required />
                </div>

                <!-- Email Address -->
                <div>
                    <label for="useremail">Email Address:</label>
                    <input type="email" id="useremail" name="useremail" placeholder="e.g., jane@example.com" required />
                </div>
            </fieldset>

            <!-- Fieldset 2: Questions -->
            <fieldset>
                <legend>Questions</legend>

                <!-- Favorite Browser -->
                <div>
                    <label for="browser">What is your favorite browser?</label>
                    <select id="browser" name="browser" required>
                        <option value="">--Please choose an option--</option>
                        <option value="chrome">Google Chrome</option>
                        <option value="firefox">Mozilla Firefox</option>
                        <option value="edge">Microsoft Edge</option>
                        <option value="safari">Safari</option>
                    </select>
                </div>

                <!-- Household Pet -->
                <div>
                    <input type="checkbox" id="pet" name="pet" value="yes" />
                    <label for="pet">Do you have a household pet?</label>
                </div>

                <!-- Places You Have Lived -->
                <div>
                    <label for="feedback">List the places you have lived:</label>
                    <textarea id="feedback" name="feedback" rows="4"
                        placeholder="e.g., Buenos Aires, Córdoba, Rosario"></textarea>
                </div>
            </fieldset>

            <!-- Submit Button -->
            <button type="submit">Submit Poll</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2025 Your Name or Your Site</p>
    </footer>
</body>

</html>

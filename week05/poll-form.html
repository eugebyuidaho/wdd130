<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WDD 130 | HTML Form User Poll</title>
</head>

<body>
    <header>
        <h1>WDD130 | Eugenia Schulz | HTML Form User Poll</h1>
    </header>

    <main>
        <form action="#" method="post">

            <fieldset>
                <legend>Contact Information</legend>


                <div>
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" placeholder="e.g., Jane Doe" required />
                </div>


                <div>
                    <label for="useremail">Email Address:</label>
                    <input type="email" id="useremail" name="useremail" placeholder="e.g., jane@example.com" required />
                </div>
            </fieldset>


            <fieldset>
                <legend>Questions</legend>


                <div>
                    <label for="browser">What is your favorite browser?</label>
                    <select id="browser" name="browser" required>
                        <option value="">--Please choose an option--</option>
                        <option value="chrome">Google Chrome</option>
                        <option value="firefox">Mozilla Firefox</option>
                        <option value="edge">Microsoft Edge</option>
                        <option value="safari">Safari</option>
                    </select>
                </div>


                <div>
                    <input type="checkbox" id="pet" name="pet" value="yes" />
                    <label for="pet">Do you have a household pet?</label>
                </div>


                <div>
                    <label for="feedback">List the places you have lived:</label>
                    <textarea id="feedback" name="feedback" rows="4"
                        placeholder="e.g., Buenos Aires, Córdoba, Rosario"></textarea>
                </div>
            </fieldset>


            <button type="submit">Submit Poll</button>
        </form>
    </main>

    <footer>
        <p>©2025 | HTML Form User Poll Activity | Eugenia Schulz</p>
    </footer>
</body>

</html>
